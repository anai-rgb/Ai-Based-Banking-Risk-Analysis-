<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aegis Bank · Loan Accounts</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/extra.css">
</head>
<body class="app-body">
  <div id="sidebarMount"></div>
  <main class="main">
    <div class="topbar">
      <div class="titles"><h1>Loan Accounts</h1><p id="countSub">Loading loan accounts…</p></div>
      <div class="topbar-right">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="globalSearchInput" placeholder="Search customers, transactions, cases…" autocomplete="off">
          <div id="globalSearchResults" class="global-search-results"></div>
        </div>
        <a class="icon-btn" href="alerts.html" style="text-decoration:none; display:grid;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg><span class="dot" id="topAlertCount">0</span></a>
      </div>
    </div>

    <!-- LOAN OVERVIEW CARDS -->
    <div class="kpi-grid" id="kpiGrid" style="margin-bottom:20px;"></div>

    <div class="panel">
      <div class="directory-toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="Search by loan ID, customer ID, or name…">
        </div>
        <select id="patternFilter">
          <option value="">All repayment patterns</option>
          <option value="On Time">On Time</option>
          <option value="Mixed">Mixed</option>
          <option value="Mostly Late">Mostly Late</option>
        </select>
        <select id="statusFilter">
          <option value="">All loan statuses</option>
          <option value="Good Standing">Good Standing</option>
          <option value="Watch">Watch</option>
          <option value="At Risk">At Risk</option>
        </select>
        <select id="sortFilter">
          <option value="amount_desc">Sort: Loan amount (high → low)</option>
          <option value="amount_asc">Sort: Loan amount (low → high)</option>
          <option value="emi_desc">Sort: EMI amount (high → low)</option>
          <option value="late_desc">Sort: Late EMIs (most first)</option>
        </select>
      </div>
      <div class="directory-count" id="resultsCount"></div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Customer ID</th><th>Customer Name</th><th>Loan ID</th><th>Loan Amount</th>
              <th>EMI Amount</th><th>Tenure</th><th>Repayment Pattern</th><th>Loan Status</th><th>Action</th>
            </tr>
          </thead>
          <tbody id="loansBody"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>

<script src="../js/customers-data.js"></script>
<script src="../js/transactions-data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/db.js"></script>
<script src="../js/audit-log.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/global-search.js"></script>
<script src="../js/list-page.js"></script>
<script src="../js/modal.js"></script>
<script src="../js/loan-accounts.js"></script>
</body>
</html>
