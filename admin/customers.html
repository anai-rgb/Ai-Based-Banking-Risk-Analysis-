<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aegis Bank · Customers</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/extra.css">
</head>
<body class="app-body">

  <div id="sidebarMount"></div>

  <main class="main">
    <div class="topbar">
      <div class="titles">
        <h1>Customers</h1>
        <p id="countSub">Loading customer directory…</p>
      </div>
      <div class="topbar-right">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="globalSearchInput" placeholder="Search customers, transactions, cases…" autocomplete="off">
          <div id="globalSearchResults" class="global-search-results"></div>
        </div>
        <a class="icon-btn" href="alerts.html" style="text-decoration:none; display:grid;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg><span class="dot" id="topAlertCount">0</span></a>
      </div>
    </div>

    <div class="panel">
      <div class="directory-toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="Search by name, customer ID, email or city…">
        </div>
        <select id="riskFilter">
          <option value="">All risk levels</option>
          <option value="Low">Low risk</option>
          <option value="Medium">Medium risk</option>
          <option value="High">High risk</option>
          <option value="Very High">Very High risk</option>
        </select>
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
        <select id="sortFilter">
          <option value="risk_desc">Sort: Risk score (high → low)</option>
          <option value="risk_asc">Sort: Risk score (low → high)</option>
          <option value="balance_desc">Sort: Balance (high → low)</option>
          <option value="name_asc">Sort: Name (A → Z)</option>
          <option value="disputes_desc">Sort: Open disputes</option>
        </select>
      </div>

      <div class="directory-count" id="resultsCount"></div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Customer</th><th>ID</th><th>Email</th><th>City</th><th>Account Type</th>
              <th>Balance</th><th>Risk Score</th><th>Risk Level</th><th>Disputes</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="customersBody"></tbody>
        </table>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </main>

<script src="../js/customers-data.js"></script>
<script src="../js/transactions-data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/db.js"></script>
<script src="../js/audit-log.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/global-search.js"></script>
<script src="../js/list-page.js"></script>
<script>
(function () {
  const session = AdminSidebar.mount("customers");
  if (!session) return;
  AuditLog.record("View", "Customers");

  const fmtINR = n => "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 0 });
  const levelBadge = { Low: "green", Medium: "amber", High: "orange", "Very High": "red" };
  const statusBadgeMap = { Active: "green", Inactive: "gray" };

  document.getElementById("countSub").textContent = `${DB.customers.length.toLocaleString("en-IN")} customers on record · click any row to open the full profile.`;

  // preset risk filter from URL (?risk=High from dashboard donut click)
  const params = new URLSearchParams(location.search);
  if (params.get("risk")) document.getElementById("riskFilter").value = params.get("risk");

  createListPage({
    data: DB.customers,
    pageSize: 25,
    searchInputId: "searchInput",
    searchFields: ["full_name", "customer_id", "email", "city"],
    filters: [
      { elId: "riskFilter", field: "risk_level" },
      { elId: "statusFilter", field: "customer_status" },
    ],
    sortSelectId: "sortFilter",
    sortFns: {
      risk_desc: (a, b) => b.risk_score - a.risk_score,
      risk_asc: (a, b) => a.risk_score - b.risk_score,
      balance_desc: (a, b) => b.balance - a.balance,
      name_asc: (a, b) => a.full_name.localeCompare(b.full_name),
      disputes_desc: (a, b) => b.open_disputes - a.open_disputes,
    },
    defaultSort: "risk_desc",
    bodyId: "customersBody",
    countId: "resultsCount",
    paginationId: "pagination",
    colSpan: 10,
    rowAttrs: c => `onclick="location.href='customer-details.html?id=${c.customer_id}'"`,
    columns: [
      { render: c => c.full_name },
      { render: c => `<span class="mono">${c.customer_id}</span>` },
      { render: c => c.email },
      { render: c => c.city },
      { render: c => c.account_type },
      { render: c => fmtINR(c.balance) },
      { render: c => `<b>${c.risk_score}</b>` },
      { render: c => `<span class="badge ${levelBadge[c.risk_level] || "gray"}">${c.risk_level}</span>` },
      { render: c => c.open_disputes > 0 ? `<span class="badge amber">${c.open_disputes} open</span>` : `<span class="badge gray">0</span>` },
      { render: c => `<span class="badge ${statusBadgeMap[c.customer_status] || "gray"}">${c.customer_status}</span>` },
    ],
    emptyMessage: "No customers match your filters.",
  });
})();
</script>
</body>
</html>
