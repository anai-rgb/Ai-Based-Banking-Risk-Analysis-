<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aegis Bank · Accounts</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/extra.css">
</head>
<body class="app-body">
  <div id="sidebarMount"></div>
  <main class="main">
    <div class="topbar">
      <div class="titles"><h1>Accounts</h1><p id="countSub">Loading accounts…</p></div>
      <div class="topbar-right">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="globalSearchInput" placeholder="Search customers, transactions, cases…" autocomplete="off">
          <div id="globalSearchResults" class="global-search-results"></div>
        </div>
        <a class="icon-btn" href="alerts.html" style="text-decoration:none; display:grid;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg><span class="dot" id="topAlertCount">0</span></a>
      </div>
    </div>

    <div class="kpi-grid" id="kpiGrid" style="margin-bottom:20px;"></div>

    <div class="panel">
      <div class="directory-toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="Search by account no., customer, ID…">
        </div>
        <select id="typeFilter">
          <option value="">All account types</option>
          <option value="Savings">Savings</option>
          <option value="Current">Current</option>
          <option value="Salary">Salary</option>
        </select>
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
        <select id="sortFilter">
          <option value="balance_desc">Sort: Balance (high → low)</option>
          <option value="balance_asc">Sort: Balance (low → high)</option>
          <option value="risk_desc">Sort: Risk score (high → low)</option>
          <option value="tx_desc">Sort: Transaction count</option>
        </select>
      </div>
      <div class="directory-count" id="resultsCount"></div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Account No.</th><th>Account ID</th><th>Customer</th><th>Type</th><th>Balance</th><th>Transactions</th><th>Risk</th><th>Status</th></tr></thead>
          <tbody id="accountsBody"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>

<script src="../js/customers-data.js"></script>
<script src="../js/transactions-data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/db.js"></script>
<script src="../js/audit-log.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/global-search.js"></script>
<script src="../js/list-page.js"></script>
<script>
(function () {
  const session = AdminSidebar.mount("accounts");
  if (!session) return;
  AuditLog.record("View", "Accounts");

  const fmtINR = n => "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 0 });
  const fmtNum = n => Number(n).toLocaleString("en-IN");
  const levelBadge = { Low: "green", Medium: "amber", High: "orange", "Very High": "red" };
  const statusBadgeMap = { Active: "green", Inactive: "gray" };

  const accounts = DB.accounts;
  document.getElementById("countSub").textContent = `${accounts.length.toLocaleString("en-IN")} accounts on record · click any row for the owner's full profile.`;

  const totalBalance = accounts.reduce((s, a) => s + a.balance, 0);
  const byType = {};
  accounts.forEach(a => byType[a.account_type] = (byType[a.account_type] || 0) + 1);
  const kpis = [
    { label: "Total Accounts", value: fmtNum(accounts.length), icon: "icon-violet", svg: `<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/>` },
    { label: "Total Balance (all accounts)", value: fmtINR(totalBalance), icon: "icon-green", svg: `<path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>` },
    { label: "Active Accounts", value: fmtNum(accounts.filter(a => a.status === "Active").length), icon: "icon-blue", svg: `<path d="M20 6L9 17l-5-5"/>` },
    { label: "Account Types", value: Object.keys(byType).length, icon: "icon-amber", svg: `<rect x="3" y="6" width="18" height="13" rx="2"/>` },
  ];
  document.getElementById("kpiGrid").innerHTML = kpis.map(k => `
    <div class="kpi-card">
      <div class="icon ${k.icon}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${k.svg}</svg></div>
      <div class="label">${k.label}</div><div class="value">${k.value}</div>
    </div>`).join("");

  createListPage({
    data: accounts,
    pageSize: 25,
    searchInputId: "searchInput",
    searchFields: ["account_number_masked", "account_id", "customer_name", "customer_id"],
    filters: [
      { elId: "typeFilter", field: "account_type" },
      { elId: "statusFilter", field: "status" },
    ],
    sortSelectId: "sortFilter",
    sortFns: {
      balance_desc: (a, b) => b.balance - a.balance,
      balance_asc: (a, b) => a.balance - b.balance,
      risk_desc: (a, b) => b.risk_score - a.risk_score,
      tx_desc: (a, b) => b.transaction_count - a.transaction_count,
    },
    defaultSort: "balance_desc",
    bodyId: "accountsBody",
    countId: "resultsCount",
    paginationId: "pagination",
    colSpan: 8,
    rowAttrs: a => `onclick="location.href='customer-details.html?id=${a.customer_id}'"`,
    columns: [
      { render: a => `<span class="mono">${a.account_number_masked}</span>` },
      { render: a => `<span class="mono">${a.account_id}</span>` },
      { render: a => a.customer_name },
      { render: a => a.account_type },
      { render: a => fmtINR(a.balance) },
      { render: a => fmtNum(a.transaction_count) },
      { render: a => `<span class="badge ${levelBadge[a.risk_level] || "gray"}">${a.risk_level}</span>` },
      { render: a => `<span class="badge ${statusBadgeMap[a.status] || "gray"}">${a.status}</span>` },
    ],
    emptyMessage: "No accounts match your filters.",
  });
})();
</script>
</body>
</html>
